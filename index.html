<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>三国志大戦 言えるかな？</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #eee;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        select, input, button {
            padding: 8px 12px;
            font-size: 16px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: #fff;
        }
        button {
            background: #007bff;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #0056b3;
        }
        /* カードイラスト表示エリア */
        .card-image-box {
            position: relative;
            width: 150px;
            height: 210px;
            margin: 20px auto;
            background: #333;
            border: 2px solid #555;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-image-box img {
            position: absolute;
            max-width: none;
            max-height: none;
        }

        /* 1. 非表示モード */
        .mode-hidden {
            display: none !important;
        }

        /* 2. 一部表示モード：画像サイズ維持・600%拡大・中央 */
        .mode-partial {
            display: block !important;
            transform: scale(6.0);
            transform-origin: center center;
        }

        /* 3. 全部表示モード：画像サイズ維持・右上から61x93pxトリミング */
        .mode-full {
            display: block !important;
            top: 0;
            right: 0;
            left: auto;
            clip-path: inset(0 0 calc(100% - 93px) calc(100% - 61px));
        }

        .quiz-info {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>三国志大戦 言えるかな？</h2>

    <!-- シリーズ選択 -->
    <div>
        <label for="seriesSelect">シリーズ: </label>
        <select id="seriesSelect" onchange="changeSeries()">
            <option value="sangokushitaisen1">三国志大戦 1</option>
            <option value="sangokushitaisen2" selected>三国志大戦 2</option>
        </select>
    </div>

    <!-- イラスト表示オプション -->
    <div style="margin: 15px 0;">
        <label for="illustMode">イラスト表示: </label>
        <select id="illustMode" onchange="changeIllustMode()">
            <option value="hidden" selected>非表示 (デフォルト)</option>
            <option value="partial">一部表示 (600%・中央)</option>
            <option value="full">全部表示 (右上 61x93px)</option>
        </select>
    </div>

    <div class="quiz-info" id="quizInfo">データを読み込み中...</div>

    <!-- イラスト表示ボックス -->
    <div class="card-image-box">
        <img id="cardImage" src="" alt="Card Image" class="mode-hidden">
    </div>

    <!-- クイズ入力・操作 -->
    <div>
        <input type="text" id="userInput" placeholder="呂布" onkeypress="if(event.key==='Enter') checkAnswer()">
        <button onclick="checkAnswer()">回答</button>
        <button onclick="nextCard()">次のカード</button>
    </div>

    <div id="result"></div>
</div>

<script>
    let currentSeries = "sangokushitaisen2";
    let cardData = [];
    let currentIndex = 0;
    let currentMode = "hidden";

    // シリーズに応じたJSONデータを読み込む（または切り替える）
    async function loadData() {
        const jsonFile = currentSeries === "sangokushitaisen2" ? "sangokushi_cards_v2.json" : "sangokushi_cards.json";
        try {
            // ※ローカルのJSONファイル構成に合わせてパスを調整してください
            const response = await fetch(jsonFile);
            cardData = await response.json();
            currentIndex = 0;
            showCard();
        } catch (e) {
            // ダミーデータ（動作確認用フォールバック）
            cardData = [
                { No: "魏001", ヨミ: "かほうが", 冠名: "魏", レアリティ: "R", 画像ファイル名: "魏001_かほうが.jpg" },
                { No: "蜀001", ヨミ: "りゅうび", 冠名: "蜀", レアリティ: "LE", 画像ファイル名: "蜀001_りゅうび.jpg" }
            ];
            showCard();
        }
    }

    function changeSeries() {
        const select = document.getElementById("seriesSelect");
        currentSeries = select.value;
        loadData();
    }

    function changeIllustMode() {
        const select = document.getElementById("illustMode");
        currentMode = select.value;
        updateImageStyle();
    }

    function updateImageStyle() {
        const img = document.getElementById("cardImage");
        img.className = ""; // クラスリセット
        if (currentMode === "hidden") {
            img.classList.add("mode-hidden");
        } else if (currentMode === "partial") {
            img.classList.add("mode-partial");
        } else if (currentMode === "full") {
            img.classList.add("mode-full");
        }
    }

    function showCard() {
        if (!cardData || cardData.length === 0) return;
        const card = cardData[currentIndex];
        
        document.getElementById("quizInfo").innerText = `No: ${card.No} | レアリティ: ${card.レアリティ || 'N'}`;
        
        // フォルダパス構造: images/シリーズ名/画像ファイル名
        const imgPath = `images/${currentSeries}/${card.画像ファイル名}`;
        const imgElement = document.getElementById("cardImage");
        imgElement.src = imgPath;
        
        document.getElementById("userInput").value = "";
        document.getElementById("result").innerText = "";
        updateImageStyle();
    }

    // カタカナをひらがなに正規化する関数
    function normalizeToHiragana(str) {
        if (!str) return "";
        return str.replace(/[\u30a1-\u30f6]/g, function(match) {
            return String.fromCharCode(match.charCodeAt(0) - 0x60);
        });
    }

    // 回答チェック（半角スペース前の一致、ひらがな・カタカナ両対応）
    fnCheckAnswer = function checkAnswer() {
        if (!cardData || cardData.length === 0) return;
        const card = cardData[currentIndex];
        
        const userInput = document.getElementById("userInput").value;
        
        // 半角スペース（または全角スペース）で区切られた前半部を取得
        const cleanUser = userInput.trim().split(/[\s ]+/)[0];
        const cleanTarget = card.ヨミ.trim().split(/[\s ]+/)[0];

        // ひらがなに変換して比較
        const normUser = normalizeToHiragana(cleanUser);
        const normTarget = normalizeToHiragana(cleanTarget);

        const resultDiv = document.getElementById("result");
        if (normUser !== "" && normUser === normTarget) {
            resultDiv.style.color = "#28a745";
            resultDiv.innerText = `正解！ (読み: ${card.ヨミ})`;
        } else {
            resultDiv.style.color = "#dc3545";
            resultDiv.innerText = `不正解... 正解は ${card.ヨミ}`;
        }
    };

    function nextCard() {
        currentIndex = (currentIndex + 1) % cardData.length;
        showCard();
    }

    // 初期ロード
    loadData();
</script>

</body>
</html>
